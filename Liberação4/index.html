<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberação técnica</title>
    <link rel="icon" href="https://github.com/Denison1298/libera-o/blob/main/Libera%C3%A7%C3%A3o4/img/icon.png?raw=true" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Logo Header -->
    <div class="header-logo">
        <img src="https://github.com/Denison1298/libera-o/blob/main/Libera%C3%A7%C3%A3o4/img/Logo.png?raw=true" alt="Logo" />
        <p class="header-text">Desenvolvido por Denison Santos</p>
    </div>

    <div class="container">
        <h1>Script</h1>
        
        <div class="tabs">
            <div class="tab-button active" onclick="showTab('interno')">Interno</div>
            <div class="tab-button" onclick="showTab('externo')">Externo</div>
            <div class="tab-button" onclick="showTab('remocao')">Open remoção</div>
            <div class="tab-button" onclick="showTab('closeremocao')">Close remoção</div>
            <div class="tab-button" onclick="showTab('saudacoes')">Saudações</div>
        </div>

        <div class="tab-content active" id="interno">
            <h2>Interno</h2>
            <p class="message">Blzz, vou enviar a validação.</p>
            <form id="interno">
                <label>Protocolo:</label>
                <input type="text" name="protocolo">
                
                <label>Instalação e lacre ONU:</label>
                <input type="text" name="instalacao_lacre_onu" value="OK">
                
                <label>Acesso ao roteador:</label>
                <input type="text" name="acesso_roteador" value="OK">
                
                <label>Sinal - ONU:</label>
                <input type="text" name="sinal_onu">

                <label>Retorno - OLT:</label>
                <input type="text" name="retorno_olt">
                
                <label>Equipamentos:</label>
                <input type="text" name="equipamentos" value="OK">
                
                <label>Pat. ONU:</label>
                <input type="text" name="pat_onu">
                
                <label>Pat. Roteador:</label>
                <input type="text" name="pat_roteador">
                
                <label>Pat. Repetidor:</label>
                <input type="text" name="pat_repetidor">
                
                <label>Pat. Equipamento retirado:</label>
                <input type="text" name="pat_equipamento_retirado">
                
                <label>Teste:</label>
                <input type="text" name="teste" value="OK">

                <label>User:</label>
                <input type="text" name="user">
                
                <label>Senha:</label>
                <input type="password" name="senha">
                
                <!-- Novo campo OBS -->
                <label>OBS:</label>
                <input type="text" name="obs" id="obsInterno">
                
                <button type="button" class="copy-button" onclick="copiarDados('interno', 'Blzz, vou enviar a validação.', 'Ajudo em algo mais?')">Copiar Tudo</button>
                <button type="button" class="clear-button" onclick="limparCampos('interno')">Limpar Campos</button>
            </form>
            <p>Ajudo em algo mais?</p>
        </div>
        
        <div class="tab-content" id="externo">
            <h2>Externo</h2>
            <p class="message">Blzz, vou enviar a validação.</p>
            <form id="externo">
                <label>Protocolo:</label>
                <input type="text" name="protocolo">
                
                <label>Instalação e lacre ONU:</label>
                <input type="text" name="instalacao_lacre_onu" value="OK">
                
                <label>Acesso ao roteador:</label>
                <input type="text" name="acesso_roteador" value="OK">
                
                <label>Documentação GEOGRID:</label>
                <input type="text" name="documentacao_geogrid" value="OK">
                
                <label>Identificação CTO:</label>
                <input type="text" name="identificacao_cto">
                
                <label>Porta:</label>
                <input type="text" name="porta">
                
                <label>Equipamentos:</label>
                <input type="text" name="equipamentos" value="OK">
                
                <label>Sinal - ONU:</label>
                <input type="text" name="sinal_onu">

                <label>Retorno - OLT:</label>
                <input type="text" name="retorno_olt">
                
                <label>Pat. ONU:</label>
                <input type="text" name="pat_onu">
                
                <label>Pat. Roteador:</label>
                <input type="text" name="pat_roteador">
                
                <label>Pat. Repetidor:</label>
                <input type="text" name="pat_repetidor">
                
                <label>Pat. Equipamento retirado:</label>
                <input type="text" name="pat_equipamento_retirado">
                
                <label>Teste:</label>
                <input type="text" name="teste" value="OK">

                <label>Usuário:</label>
                <input type="text" name="usuario">
                
                <label>Senha:</label>
                <input type="password" name="senha">
                
                <label>OBS:</label>
                <input type="text" name="obs">
                
                <button type="button" class="copy-button" onclick="copiarDados('externo', 'Blzz, vou enviar a validação.', 'Ajudo em algo mais?')">Copiar Tudo</button>
                <button type="button" class="clear-button" onclick="limparCampos('externo')">Limpar Campos</button>
            </form>
            <p>Ajudo em algo mais?</p>
        </div>

        <div class="tab-content" id="remocao">
            <h2>Remoção</h2>
            <form id="remocao">
                <label>Código:</label>
                <input type="text" name="codigo">
                
                <label>Nome do Cliente:</label>
                <input type="text" name="nome_cliente">
                
                <label>Antigo Ponto de Acesso:</label>
                <input type="text" name="antigo_ponto_acesso">
                
                <label>Porta:</label>
                <input type="text" name="porta">
                
                <label>Localização CTO:</label>
                <input type="text" name="localizacao_cto">
                
                <button type="button" class="copy-button" onclick="copiarDados('remocao', '', '')">Copiar Tudo</button>
                <button type="button" class="clear-button" onclick="limparCampos('remocao')">Limpar Campos</button>
            </form>
        </div>

        <div class="tab-content" id="closeremocao">
            <h2>Close remoção</h2>
            <form id="closeremocao">
                <label>Protocolo:</label>
                <input type="text" name="protocolo">

                <label>Técnico:</label>
                <input type="text" name="tecnico">
                
                <label>Código:</label>
                <input type="text" name="codigo">
                
                <label>Nome do Cliente:</label>
                <input type="text" name="nome_cliente">
                
                <label>Cto:</label>
                <input type="text" name="cto">
                
                <label>Porta:</label>
                <input type="text" name="porta">
                
                <button type="button" class="copy-button" onclick="copiarDados('closeremocao', '', '')">Copiar Tudo</button>
                <button type="button" class="clear-button" onclick="limparCampos('closeremocao')">Limpar Campos</button>
            </form>
        </div>

        <div class="tab-content" id="saudacoes">
            <h2>Saudações</h2>

            <!-- Campo para alterar o nome do atendente -->
            <div>
                <label for="nomeAtendente">Digite o nome do atendente:</label>
                <input type="text" id="nomeAtendente" placeholder="Exemplo: Denison">
                <button type="button" class="alterar-nome-button" onclick="alterarNomeAtendente()">Alterar Nome</button>
            </div>

            <div class="message-area">
                <!-- As mensagens abaixo serão atualizadas dinamicamente -->
                <button type="button" class="copy-button" id="msgBomDia">Bom dia, Sou o atendente Denison, vou ser responsável pelo seu atendimento. ✅</button>
                <button type="button" class="copy-button" id="msgBoaTarde">Boa tarde, Sou o atendente Denison, vou ser responsável pelo seu atendimento. ✅</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('É o cliente “nome do cliente”? ❓')">É o cliente “nome do cliente”? ❓</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Qual foi a tratativa realizada no local? 🤔')">Qual foi a tratativa realizada no local? 🤔</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Preciso de uma foto mais ampla, mostrando o cômodo onde estão instalados os equipamentos')">Preciso de uma foto mais ampla, mostrando o cômodo onde estão instalados os equipamentos</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('As fotos foram validadas ✅')">As fotos foram validadas ✅</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Já realizei as movimentações. ✅')">Já realizei as movimentações. ✅</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Movimentações ok ✅')">Movimentações ok ✅</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('O cliente testou a conexão? 🛜')">O cliente testou a conexão? 🛜</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Obrigado, bom trabalho! 🫡')">Obrigado, bom trabalho! 🫡</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Por nada, bom trabalho! 🫡')">Por nada, bom trabalho! 🫡</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Maravilha, bom trabalho! 🫡')">Maravilha, bom trabalho! 🫡</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Agradeço seu contato, tenha um bom dia! 🫡')">Agradeço seu contato, tenha um bom dia! 🫡</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Mestre, você retirou algum equipamento? ⚠️')">Mestre, você retirou algum equipamento? ⚠️</button>
                <button type="button" class="copy-button" onclick="copiarMensagem('Feito chefia! Obrigado e bom trabalho! 🫡')">Feito chefia! Obrigado e bom trabalho! 🫡</button>
            </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>
    <script src="scripts.js"></script>
</body>
</html>
